[package]
name = "adjlayer"
version = "0.1.0"
edition = "2021"
description = "Apply a NodeVideo-style Adjustment Layer (clean JSON or raw .nv) to a video or image using ffmpeg"

# Pure-Rust dependencies only: builds on Termux without any C library or bindgen.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"

[profile.release]
opt-level = 3
